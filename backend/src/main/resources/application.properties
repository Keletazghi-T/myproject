spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/metsalu;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
voice.stun-url=${VOICE_STUN_URL:stun:stun.l.google.com:19302}
voice.turn-url=${VOICE_TURN_URL:}
voice.turn-username=${VOICE_TURN_USERNAME:}
voice.turn-credential=${VOICE_TURN_CREDENTIAL:}
